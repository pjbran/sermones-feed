name: render
on:
  push:
    branches: [main]
    paths: ['jobs/**', 'pipeline/**']
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'   # 6 am Sydney: releases held jobs (not_before)
permissions:
  contents: write
  pages: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          for i in 1 2 3; do timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && break; echo apt update retry $i; done
          for i in 1 2 3; do timeout 300 sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg fonts-dejavu-core && break; echo apt install retry $i; done
          pip install -q numpy requests pillow piper-tts
          if ! command -v ffmpeg >/dev/null; then   # 28 Oct: apt hung, the run had no ffmpeg. Fallback: the PyPI build.
            pip install -q imageio-ffmpeg
            sudo ln -sf "$(python -c 'import imageio_ffmpeg as i; print(i.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Run jobs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/run_jobs.py
      - name: Save results
        if: always()
        run: |
          git config user.name "sermones-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Render jobs [bot]"
            git pull --rebase -q origin main || true
            git push
          fi
      - name: Rebuild the site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
